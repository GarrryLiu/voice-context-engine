[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-context-engine"
version = "0.1.0"
description = "Branch-aware persistent context reference engine for voice agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
infra = ["psycopg[binary]>=3.2,<4", "confluent-kafka>=2.6,<3", "redis>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]
