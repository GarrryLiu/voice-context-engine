[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-context-engine"
version = "0.1.0"
description = "Branch-aware persistent context reference engine for voice agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = ["websockets>=15,<17", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=2,<3", "python-dotenv>=1,<2"]
dev = ["httpx>=0.27,<1", "playwright>=1.49,<2"]
llm = ["openai>=2,<3", "python-dotenv>=1,<2"]
infra = ["psycopg[binary]>=3.2,<4", "confluent-kafka>=2.6,<3", "redis>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_context = ["web/*.html", "web/*.js", "web/*.css"]
