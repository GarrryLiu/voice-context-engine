<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="voice-token" content="__LOCAL_TOKEN__"><title>Voice Workspace · 功能实验台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script><script defer src="/live.js"></script></head><body><main>
<nav class="view-nav" aria-label="版本切换"><span>功能实验台</span><a href="/product">切换到产品体验版 ↗</a></nav><header><span class="eyebrow">LOCAL WORKSPACE · VOICE / 01</span><h1>把思路说下来。</h1><p>连续说话、停顿后回复，也可手动录音。记忆与分支保存在本机配置的数据库。</p></header>
<section class="toolbar"><label>当前分支 <select id="branch" aria-label="当前分支"></select></label><button id="fork">创建分支</button><span id="connection">正在连接…</span></section>
<section class="capture"><div id="status" role="status" aria-live="polite">准备就绪</div><div class="buttons"><button id="live">开始连续对话</button><button id="record" class="primary" disabled>开始录音</button><button id="stop" disabled>停止并发送</button><button id="interrupt" disabled>停止播放</button></div><p class="hint">每次最多 20 秒。浏览器会请求麦克风权限；回复为 AI 合成声音。</p><label class="upload">或上传固定录音 <input id="file" type="file" accept="audio/webm,audio/ogg,audio/mp4,audio/wav"></label></section>
<section class="dialogue"><article><h2>你的发言</h2><p id="transcript">等待录音…</p></article><article><h2>工作区回复</h2><p id="answer">开始一次对话。</p></article></section>
<section class="metrics"><span>转写 <strong id="stt">—</strong></span><span>首段排程 <strong id="first">—</strong></span><span>生成完成 <strong id="total">—</strong></span></section><p class="footnote">排程时间是浏览器软件指标，不代表扬声器实测延迟。连续模式最长 120 秒，使用停顿检测分句，开口自动停止旧回复；安静环境与耳机效果更稳定。</p>
</main></body></html>
