name: local-reference
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m voice_context
      - run: PYTHONPATH=src python experiments/run.py --output /tmp/vce-artifacts/structured.json
      - run: PYTHONPATH=src python experiments/end_to_end.py --output /tmp/vce-artifacts/end-to-end.json
      - run: PYTHONPATH=src python experiments/routing.py --output /tmp/vce-artifacts/routing.json
      - run: python -m compileall -q src experiments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-experiments-python-${{ matrix.python }}
          path: /tmp/vce-artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
