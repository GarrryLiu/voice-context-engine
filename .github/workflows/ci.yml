name: local-reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py contracts --strict

  product:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VOICE_BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[voice,dev]'
      - run: python -m playwright install --with-deps chromium
      - run: node --check src/voice_context/web/product-entry.js
      - run: node --check src/voice_context/web/client/runtime.js
      - run: node --check src/voice_context/web/client/navigation.js
      - run: node --check src/voice_context/web/client/demo.js
      - run: python scripts/check.py product --browser --strict

  test:
    runs-on: ubuntu-latest
    env:
      VOICE_RUNTIME_LIBRARY: ${{ github.workspace }}/build/libvoice_runtime.so
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/build_runtime.py
      - run: clang++ -std=c++17 -O1 -g -pthread -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer native/test_runtime.cpp -o build/native-sanitized
      - run: build/native-sanitized > /tmp/native-result.json
      - run: pip install -e '.[llm]'
      - run: python scripts/check.py infra --strict
      - run: PYTHONPATH=src python -m voice_context
      - run: PYTHONPATH=src python experiments/run.py --output /tmp/results.json
      - run: PYTHONPATH=src python experiments/end_to_end.py --output /tmp/end-to-end.json
      - run: PYTHONPATH=src python experiments/routing.py --output /tmp/routing.json
      - run: PYTHONPATH=src python experiments/realtime.py --output /tmp/realtime-results.json
      - run: python -m compileall -q src experiments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-results-python-${{ matrix.python }}
          path: |
            /tmp/native-result.json
            /tmp/results.json
            /tmp/end-to-end.json
            /tmp/routing.json
            /tmp/realtime-results.json
          retention-days: 14

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      VOICE_RUNTIME_LIBRARY: ${{ github.workspace }}/build/libvoice_runtime.so
      VOICE_TEST_POSTGRES: postgresql://voice:local-dev-only@localhost:55432/voice
      VOICE_TEST_KAFKA: 127.0.0.1:59092
      VOICE_TEST_REDIS: redis://127.0.0.1:56379/0
      VOICE_BROWSER_TEST: "1"
      VOICE_SCREENSHOT: /tmp/voice-browser.png
      VOICE_FAULT_RESULTS: /tmp/voice-fault-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[infra,voice,dev]'
      - name: Pull local service images with bounded retry
        run: |
          for attempt in 1 2 3; do
            if docker compose pull; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: docker compose up -d --pull never
      - run: python -m playwright install --with-deps chromium
      - run: node --check src/voice_context/web/app.js
      - run: node --check src/voice_context/web/workspace.js
      - run: node --check src/voice_context/web/documents.js
      - run: node --check src/voice_context/web/product.js
      - run: node --check src/voice_context/web/strings.js
      - run: node --check src/voice_context/web/live.js
      - run: node --check src/voice_context/web/capture.js
      - run: python scripts/wait_infra.py
      - run: python scripts/build_runtime.py
      - run: python scripts/check.py integration --browser --services --strict
      - run: python experiments/infrastructure.py --restart-services --output /tmp/infrastructure-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-results
          path: |
            /tmp/infrastructure-results.json
            /tmp/voice-browser.png
            /tmp/voice-fault-results.json
      - run: docker compose logs --tail=80
        if: failure()
      - run: docker compose down
        if: always()
